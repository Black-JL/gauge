<meta charset="utf-8">
<title>GAUGE — VU meters</title>
<style>
  :root{--face:#f0e5c6; --scale:#1c1710; --dim:#7a6c48; --red:#c0261b; --glow:#ffb552;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 120% at 50% 30%,#241a10 0%,#140d07 60%,#080503 100%);
    color:#e8dcbf;font-family:'Futura','Helvetica Neue',sans-serif;font-weight:300;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;}
  .brand{letter-spacing:.6em;font-size:12px;color:#a3844e;text-transform:uppercase;
    margin-bottom:30px;padding-left:.6em;text-shadow:0 0 12px rgba(255,181,82,.35);}
  .rack{display:flex;align-items:flex-start;justify-content:center;gap:26px;}
  .meter{display:flex;flex-direction:column;align-items:center;}
  .panel{width:308px;height:196px;position:relative;
    filter:drop-shadow(0 0 26px rgba(255,150,40,.20)) drop-shadow(0 16px 26px rgba(0,0,0,.6));}
  svg{display:block;width:100%;height:100%;}
  .readout{margin-top:16px;text-align:center;}
  .val{font-size:23px;letter-spacing:.05em;color:#f3e8cb;font-variant-numeric:tabular-nums;
    text-shadow:0 0 10px rgba(255,181,82,.35);}
  .val .u{font-size:.46em;color:#a3844e;letter-spacing:.14em;margin-left:.25em;text-shadow:none;}
  .sub{font-size:10px;letter-spacing:.26em;color:#8a7448;text-transform:uppercase;margin-top:6px;}
  .footer{margin-top:40px;display:flex;gap:42px;font-size:10.5px;letter-spacing:.28em;
    color:#8a7448;text-transform:uppercase;}
  .footer b{color:#e8dcbf;text-shadow:0 0 8px rgba(255,181,82,.35);}
</style>

<div class="brand">Gauge</div>
<div class="rack">
  <div class="meter" id="m-mem"><div class="panel"></div>
    <div class="readout"><div class="val">—</div><div class="sub">Memory</div></div></div>
  <div class="meter" id="m-cpu"><div class="panel"></div>
    <div class="readout"><div class="val">—</div><div class="sub">CPU</div></div></div>
  <div class="meter" id="m-disk"><div class="panel"></div>
    <div class="readout"><div class="val">—</div><div class="sub">Disk</div></div></div>
</div>
<div class="footer">
  <span>Apple <b>M1 Pro</b></span><span><b>10</b> Cores</span>
  <span><b>32</b> GB</span><span id="clock">—</span>
</div>

<script>
const PX=154, PY=214, R=150;                 // needle pivot + scale radius
const d2r=d=>d*Math.PI/180;
const VP=(r,d)=>[PX+r*Math.cos(d2r(d)),PY+r*Math.sin(d2r(d))];
const vA=f=>-125+f*70;                        // sweep ±35° around vertical
function vArc(r,f0,f1){const [x0,y0]=VP(r,vA(f0)),[x1,y1]=VP(r,vA(f1));
  return `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1}`;}

function buildVU(cfg){
  let ticks='',nums='';
  for(let i=0;i<=cfg.minor;i++){const f=i/cfg.minor,a=vA(f),[x0,y0]=VP(R,a),[x1,y1]=VP(R-6,a);
    ticks+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${cfg.scaleDim||'#8a7a52'}" stroke-width="1"/>`;}
  cfg.majors.forEach(m=>{const a=vA(m.f),inRed=cfg.redBand&&m.f>=cfg.redBand[0]-1e-6&&m.f<=cfg.redBand[1]+1e-6;
    const col=inRed?'var(--red)':'var(--scale)';const [x0,y0]=VP(R,a),[x1,y1]=VP(R-11,a);
    ticks+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;
    const [tx,ty]=VP(R-22,a);
    nums+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="12" fill="${col}">${m.label}</text>`;});
  const redZone=cfg.redBand?`<path d="${vArc(R+3,cfg.redBand[0],cfg.redBand[1])}" stroke="var(--red)" stroke-width="3.5" fill="none"/>`:'';
  const peak=cfg.peakLed?`<circle class="peakled" cx="278" cy="30" r="5" fill="#3a0f0a"/>
    <text x="278" y="48" text-anchor="middle" font-size="7" letter-spacing="1.5" fill="#8a7448">PEAK</text>`:'';
  let batt='';
  if(cfg.battery)batt=`<g class="battind" transform="translate(40 34)">
    <rect x="-15" y="-6" width="26" height="12" rx="2.4" fill="none" stroke="#8a7448" stroke-width="1.2"/>
    <rect x="11" y="-2.6" width="2.4" height="5.2" rx="1" fill="#8a7448"/>
    <rect class="battfill" x="-12.5" y="-3.6" width="21" height="7.2" rx="1" fill="#2f7d1f"/>
    <path class="battbolt" d="M 1 -4.5 L -3 0.5 L 0 0.5 L -1.5 4.8 L 3 -0.8 L 0.5 -0.8 Z" fill="#0a2410"/>
    <text class="battpct" x="-2" y="16" text-anchor="middle" font-size="7.5" fill="#8a7448" font-variant-numeric="tabular-nums">100%</text></g>`;
  return `
  <svg viewBox="0 0 308 196">
    <defs>
      <radialGradient id="glass_${cfg.id}" cx="50%" cy="86%" r="86%">
        <stop offset="0%" stop-color="#fff4d8"/><stop offset="42%" stop-color="#f0e5c6"/>
        <stop offset="100%" stop-color="#d8c79c"/></radialGradient>
      <radialGradient id="warm_${cfg.id}" cx="50%" cy="92%" r="70%">
        <stop offset="0%" stop-color="rgba(255,196,110,.55)"/><stop offset="100%" stop-color="rgba(255,196,110,0)"/></radialGradient>
      <linearGradient id="bezel_${cfg.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a3128"/><stop offset="100%" stop-color="#17120c"/></linearGradient>
    </defs>
    <rect x="2" y="2" width="304" height="192" rx="10" fill="url(#bezel_${cfg.id})" stroke="#0c0906" stroke-width="1.5"/>
    <rect x="12" y="12" width="284" height="172" rx="7" fill="url(#glass_${cfg.id})"/>
    <ellipse cx="154" cy="180" rx="150" ry="90" fill="url(#warm_${cfg.id})"/>
    ${redZone}${ticks}${nums}
    <text x="154" y="150" text-anchor="middle" font-size="11" letter-spacing="4" fill="var(--scale)" opacity="0.85">${cfg.name}</text>
    <text x="154" y="166" text-anchor="middle" font-size="7.5" letter-spacing="2.5" fill="var(--dim)">${cfg.unit||''}</text>
    ${peak}${batt}
    <g class="needle" transform="rotate(${vA(0)} ${PX} ${PY})">
      <polygon points="${PX+R-6},${PY} ${PX-8},${PY-1.3} ${PX-8},${PY+1.3}" fill="#171008"/></g>
    <circle cx="${PX}" cy="${PY}" r="9" fill="#171008"/>
  </svg>`;
}

const CPU={host:'#m-cpu',cfg:{id:'cpu',name:'CPU',unit:'% PROCESSOR LOAD',minor:40,redBand:[0.85,1],peakLed:true,
    majors:[0,20,40,60,80,100].map(n=>({f:n/100,label:String(n)}))},
  fmt:v=>({val:Math.round(v*100)+'<span class="u">%</span>',sub:'peak '+Math.round((CPU.peak||0)*100)+'%'})};
const MEM={host:'#m-mem',cfg:{id:'mem',name:'MEMORY',unit:'% PRESSURE',minor:40,redBand:[0.85,1],
    majors:[0,20,40,60,80,100].map(n=>({f:n/100,label:String(n)}))},
  fmt:v=>({val:(v*32).toFixed(1)+'<span class="u">GB</span>',sub:Math.round(v*100)+'% of 32'})};
const DISK={host:'#m-disk',cfg:{id:'disk',name:'DISK',unit:'% FREE SPACE',minor:40,redBand:[0,0.15],battery:true,
    majors:[0,20,40,60,80,100].map(n=>({f:n/100,label:String(n)}))},
  fmt:v=>({val:Math.round(v*100)+'<span class="u">%</span>',sub:Math.round(v*995)+' GB free'})};

function mount(g){const host=document.querySelector(g.host+' .panel');host.innerHTML=buildVU(g.cfg);
  g.needle=host.querySelector('.needle');g.peakled=host.querySelector('.peakled');
  g.battfill=host.querySelector('.battfill');g.battbolt=host.querySelector('.battbolt');g.battpct=host.querySelector('.battpct');
  g.valEl=document.querySelector(g.host+' .val');g.subEl=document.querySelector(g.host+' .sub');g.cur=0;}
[MEM,CPU,DISK].forEach(mount);
const setN=(g,f)=>g.needle.setAttribute('transform',`rotate(${vA(Math.max(0,Math.min(1,f)))} ${PX} ${PY})`);

const targets={mem:0.34,disk:66/995};
const battery={charge:1.0,charging:true};
let tMEM=0.34,frame=0;
const coreLoads=Array.from({length:10},()=>0.1),coreTargets=Array.from({length:10},()=>0.1);
CPU.peak=0.1;
function tick(){
  frame++;
  if(frame%20===0){for(let i=0;i<10;i++){const s=(i%4===0);
    coreTargets[i]=Math.max(0.02,Math.min(0.99,coreTargets[i]+(Math.random()-0.5)*(s?1.3:0.4)));
    if(s&&Math.random()<0.3)coreTargets[i]=0.85+Math.random()*0.14;}
    tMEM=Math.max(0.22,Math.min(0.6,tMEM+(Math.random()-0.5)*0.12));}
  for(let i=0;i<10;i++){const s=(i%4===0);coreLoads[i]+=(coreTargets[i]-coreLoads[i])*(s?0.35:0.12);}
  const overall=coreLoads.reduce((a,b)=>a+b,0)/10,peak=Math.max(...coreLoads);
  CPU.cur+=(overall-CPU.cur)*0.06;CPU.peak+=(peak-CPU.peak)*0.45;
  MEM.cur+=(tMEM-MEM.cur)*0.05;DISK.cur+=(targets.disk-DISK.cur)*0.04;
  setN(MEM,MEM.cur);setN(CPU,CPU.cur);setN(DISK,DISK.cur);
  // CPU peak lamp
  const hot=CPU.peak>0.85;
  CPU.peakled.setAttribute('fill',hot?'#ff3b2a':'#3a0f0a');
  CPU.peakled.setAttribute('filter',hot?'':'');
  if(hot)CPU.peakled.setAttribute('opacity',0.6+0.4*Math.abs(Math.sin(frame*0.3)));else CPU.peakled.setAttribute('opacity',1);
  // battery on disk meter
  const bc=battery.charge,low=bc<0.15;
  DISK.battfill.setAttribute('width',(21*bc).toFixed(1));DISK.battfill.setAttribute('fill',low?'var(--red)':'#2f7d1f');
  DISK.battbolt.setAttribute('opacity',battery.charging?1:0);DISK.battpct.textContent=Math.round(bc*100)+'%';
  const c=CPU.fmt(CPU.cur),m=MEM.fmt(MEM.cur),d=DISK.fmt(DISK.cur);
  CPU.valEl.innerHTML=c.val;CPU.subEl.textContent=c.sub;MEM.valEl.innerHTML=m.val;MEM.subEl.textContent=m.sub;
  DISK.valEl.innerHTML=d.val;DISK.subEl.textContent=d.sub;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function clk(){const n=new Date();document.getElementById('clock').innerHTML='<b>'+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</b>';}
clk();setInterval(clk,10000);
</script>
