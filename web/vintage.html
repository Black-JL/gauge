<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gauge · Vintage</title>
<style>
 :root{--ink:#f4f1e9;--dim:#6a6558;--dim2:#9a9384;--red:#e02718;--green:#37c85a;--accent:#ff8a1e;}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{height:100%;overflow:hidden;background:radial-gradient(130% 130% at 50% 20%,#17161a 0%,#0a0a0c 60%,#050506 100%)}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;
   font-family:'Futura','Avenir Next Condensed','Helvetica Neue',sans-serif;color:var(--ink);
   -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
 #back{position:fixed;top:14px;left:20px;color:var(--dim2);text-decoration:none;font-size:22px;z-index:9}
 .brand{letter-spacing:.55em;font-size:12px;color:var(--dim2);text-transform:uppercase;margin-bottom:26px;padding-left:.55em}
 .cluster{display:flex;align-items:center;justify-content:center;gap:10px}
 .gauge{display:flex;flex-direction:column;align-items:center}
 .gauge.side .dial{width:224px;height:224px}
 .gauge.center .dial{width:326px;height:326px;z-index:2}
 .gauge.side{transform:translateY(26px)}
 .gauge.side#mem{margin-right:-20px}.gauge.side#disk{margin-left:-20px}
 .dial{position:relative;filter:drop-shadow(0 16px 30px rgba(0,0,0,.65))}
 svg{display:block;width:100%;height:100%}
 .readout{margin-top:14px;text-align:center}
 .val{font-size:24px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
 .center .val{font-size:31px}
 .val .u{font-size:.46em;color:var(--dim2);letter-spacing:.14em;margin-left:.25em}
 .sub{font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;margin-top:6px}
 .foot{margin-top:32px;display:flex;gap:40px;align-items:center;font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
 .foot b{color:var(--dim2);font-weight:400}
</style></head><body>
<a id="back" href="/">‹</a><div id="app"></div>
<script>window.GV='vintage'</script><script src="/core.js"></script>
</body></html>
