<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gauge · Clean</title>
<style>
 :root{--ink:#fff;--dim:#565656;--dim2:#8c8c8c;--red:#ff3b30;--green:#32d74b;--accent:#fff;}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{height:100%;background:#000;overflow:hidden}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;
   font-family:'Helvetica Neue',Inter,system-ui,sans-serif;font-weight:300;color:var(--ink);
   -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
 #back{position:fixed;top:14px;left:20px;color:var(--dim);text-decoration:none;font-size:22px;z-index:9}
 .brand{letter-spacing:.62em;font-size:12px;color:var(--dim2);text-transform:uppercase;margin-bottom:28px;padding-left:.62em}
 .cluster{display:flex;align-items:center;justify-content:center;gap:26px}
 .gauge{display:flex;flex-direction:column;align-items:center}
 .gauge.side .dial{width:214px;height:214px}
 .gauge.center .dial{width:308px;height:308px}
 .gauge.side{transform:translateY(26px)}
 .dial{position:relative;filter:drop-shadow(0 10px 26px rgba(0,0,0,.7))}
 svg{display:block;width:100%;height:100%}
 .readout{margin-top:16px;text-align:center}
 .val{font-size:23px;font-weight:200;letter-spacing:.04em;font-variant-numeric:tabular-nums}
 .center .val{font-size:30px}
 .val .u{font-size:.46em;color:var(--dim2);letter-spacing:.15em;margin-left:.25em}
 .sub{font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;margin-top:6px}
 .foot{margin-top:36px;display:flex;gap:40px;align-items:center;font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
 .foot b{color:var(--dim2);font-weight:400}
</style></head><body>
<a id="back" href="/">‹</a><div id="app"></div>
<script>window.GV='minimal'</script><script src="/core.js"></script>
</body></html>
