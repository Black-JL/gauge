<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gauge · Watch + Clock</title>
<style>
 :root{--ink:#e8e6df;--lume:#cfeee0;--dim:#4c4c4c;--dim2:#7c7c76;--red:#e8321f;}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{height:100%;overflow:hidden;background:radial-gradient(120% 120% at 50% 40%,#0d0d0e 0%,#060606 60%,#000 100%)}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;
   font-family:'Helvetica Neue','Futura',system-ui,sans-serif;font-weight:300;color:var(--ink);
   -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
 #back{position:fixed;top:14px;left:20px;color:var(--dim2);text-decoration:none;font-size:22px;z-index:9}
 .brand{letter-spacing:.6em;font-size:12px;color:var(--dim2);text-transform:uppercase;margin-bottom:22px;padding-left:.6em}
 .row{display:flex;align-items:flex-start;justify-content:center;gap:48px}
 .col{display:flex;flex-direction:column;align-items:center}
 .watch{width:360px;height:360px;filter:drop-shadow(0 22px 44px rgba(0,0,0,.75))}
 svg{display:block;width:100%;height:100%}
 .cap{margin-top:20px;font-size:10px;letter-spacing:.34em;color:var(--dim2);text-transform:uppercase}
 .dig{margin-top:8px;font-size:11px;letter-spacing:.18em;color:var(--dim);font-variant-numeric:tabular-nums;text-transform:uppercase}
 .dig b{color:var(--ink);font-weight:400}
</style></head><body>
<a id="back" href="/">‹</a><div id="app"></div>
<script>window.GV='pair'</script><script src="/core.js"></script>
</body></html>
